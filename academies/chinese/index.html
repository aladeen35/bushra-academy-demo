<link rel="stylesheet" href="kit/css/base.css?v=1">
<link rel="stylesheet" href="kit/css/academy.css?v=1">
<style>
  /* Chinese Academy accent: Albushra deep red + gold, Chinese type. */
  :root { --tl: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; --tl-display: "Noto Serif SC", "Songti SC", serif; --accent: #b3121b; }
  :root[data-theme="dark"] { --accent: #ff6b70; }
</style>
<script>
  try {
    const p = JSON.parse(localStorage.getItem("ac.prefs") || "{}");
    document.documentElement.dataset.theme = p.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    if (p.lang === "en") { document.documentElement.lang = "en"; document.documentElement.dir = "ltr"; }
  } catch (e) {}
</script>
<script type="module">
  import cfg from "./academy.js?v=1";
  import { start } from "./kit/js/app.js?v=1";
  start(cfg);
</script>
</head>
