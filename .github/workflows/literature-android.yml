name: Literature Android app (APK + AAB)

# Builds the Albushra Literature Android app from the PWA with Bubblewrap (Trusted Web Activity).
# Run it from the phone: GitHub app -> Actions -> "Literature Android app (APK + AAB)" -> Run workflow.
# It only builds and uploads files; it never commits or pushes.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version shown in the store (e.g. 1.0.1)"
        required: false
        default: "1.0.0"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.LITERATURE_KEYSTORE_PASSWORD }}
      KEYSTORE_B64: ${{ secrets.LITERATURE_KEYSTORE_BASE64 }}
    defaults:
      run:
        working-directory: literature/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install Bubblewrap
        run: npm i -g @bubblewrap/cli@1.27.0
      - name: Point Bubblewrap at the runner's JDK and Android SDK
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          sudo ln -sfn "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          BT=$(node -p "require('$(npm root -g)/@bubblewrap/cli/node_modules/@bubblewrap/core/dist/lib/androidSdk/AndroidSdkTools.js').BUILD_TOOLS_VERSION" 2>/dev/null || node -p "require('$(npm root -g)/@bubblewrap/core/dist/lib/androidSdk/AndroidSdkTools.js').BUILD_TOOLS_VERSION")
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;$BT" > /dev/null
      - name: Signing key (from secrets, or a new one for the first build)
        id: key
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android.keystore
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            PASS="${KEYSTORE_PASSWORD:-$(openssl rand -hex 16)}"
            echo "::add-mask::$PASS"
            keytool -genkeypair -v -keystore android.keystore -alias literature -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Albushra Literature, O=Albushra Technology, C=SA"
            echo "$PASS" > keystore-password.txt
            base64 -w0 android.keystore > android.keystore.base64.txt
            echo "KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate the Android project
        run: |
          VC=$(( 100 + ${{ github.run_number }} ))
          VN="${{ github.event.inputs.version_name }}"; echo "$VN" | grep -Eq '^[0-9]+(\.[0-9]+)*$' || VN="1.0.0"
          # Icons and manifest are served from the repo so the build works even before the site is updated.
          (cd .. && python3 -m http.server 8765 >/dev/null 2>&1 &) ; sleep 2
          node -e "const f='twa-manifest.json';const m=require('./'+f);m.appVersionCode=$VC;m.appVersionName='$VN';m.iconUrl='http://127.0.0.1:8765/assets/icon-512.png';m.maskableIconUrl='http://127.0.0.1:8765/assets/icon-maskable-512.png';m.webManifestUrl='http://127.0.0.1:8765/manifest.webmanifest';require('fs').writeFileSync(f,JSON.stringify(m,null,2))"
          bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json
      - name: Build signed APK and AAB
        run: |
          BUBBLEWRAP_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" BUBBLEWRAP_KEY_PASSWORD="$KEYSTORE_PASSWORD" bubblewrap build --skipPwaValidation --manifest=./twa-manifest.json
      - name: Upload-key fingerprint for assetlinks.json
        run: |
          FP=$(keytool -list -v -keystore android.keystore -alias literature -storepass "$KEYSTORE_PASSWORD" | grep -m1 'SHA256:' | sed 's/.*SHA256: //')
          echo "### Albushra Literature Android build" >> "$GITHUB_STEP_SUMMARY"
          echo "Upload key SHA-256: \`$FP\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Send this fingerprint, and the App signing key SHA-256 from Play Console → App integrity, to update literature/.well-known/assetlinks.json." >> "$GITHUB_STEP_SUMMARY"
          echo "$FP" > upload-key-sha256.txt
      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: albushra-literature-android
          path: |
            literature/android/app-release-signed.apk
            literature/android/app-release-bundle.aab
            literature/android/upload-key-sha256.txt
      - name: Upload the NEW signing key (download once, keep it safe, then save it as secrets)
        if: steps.key.outputs.new == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: KEEP-THIS-SAFE-literature-signing-key
          path: |
            literature/android/android.keystore
            literature/android/android.keystore.base64.txt
            literature/android/keystore-password.txt
          retention-days: 7
