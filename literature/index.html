<link rel="stylesheet" href="css/app.css?v=2">
<script>
  // Apply saved theme/lang before first paint (no flash).
  try {
    const p = JSON.parse(localStorage.getItem("lit.prefs") || "{}");
    const theme = p.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.dataset.theme = theme;
    if (p.lang === "en") { document.documentElement.lang = "en"; document.documentElement.dir = "ltr"; }
  } catch (e) {}
</script>
<script type="module" src="js/app.js?v=2"></script>
</head>

    <main id="main" tabindex="-1"></main>
  </div>
</div>
